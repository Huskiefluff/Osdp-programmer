name: OSDP Reader Programmer

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb python3-tk
          python -m pip install -r requirements-dev.txt libosdp
      - name: Test (includes interop against libosdp and the GUI under Xvfb)
        run: xvfb-run -a python -m pytest -v

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -v
      - name: Build executables
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name OSDPReaderProgrammer --paths src launch_gui.py
          pyinstaller --noconfirm --clean --onefile --console --name readerprog --paths src launch_cli.py
      - name: Smoke test the built command-line exe
        run: |
          dist\readerprog.exe ports
          dist\readerprog.exe scan --simulate
          dist\readerprog.exe program --simulate --new-addr 0 --no-log
        shell: cmd
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\OSDPReaderProgrammer.exe, dist\readerprog.exe, README.md package\
      - uses: actions/upload-artifact@v4
        with:
          name: OSDPReaderProgrammer-windows
          path: package/
          retention-days: 90
